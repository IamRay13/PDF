<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Forms & Annotation</title>
  <link rel="icon" type="image/jpg" href="PDF icon.jpg">
  <style>
    /* Background image & basic styling */
    body {
      background-image: url('IMG_7391.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      background-position: right;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    h1, p {
      color: white;
      font-family: 'Calibri', sans-serif;
    }
    
    /* Dropdown styling */
    select {
      padding: 10px;
      font-size: 16px;
      margin: 20px;
      color: #000; /* dropdown text (ink) is black by default */
    }
    
    /* PDF container styling */
    .pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    iframe {
      width: 80%;
      height: 800px;
      border: 1px solid #ccc;
      display: none; /* Hidden by default */
    }

    /* Drawing canvas container */
    .draw-container {
      margin-top: 30px;
      text-align: center;
    }
    .draw-container h2 {
      color: #fff;
      font-family: 'Calibri', sans-serif;
    }
    #drawCanvas {
      width: 80%;
      height: 400px;
      border: 2px solid #ccc;
      background-color: #fff;
      touch-action: none; /* Prevent default touch events on mobile */
    }
    #clearCanvas {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #009688;
      color: #fff;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    #clearCanvas:hover {
      background-color: #0056b3;
    }
    
    /* Notification message */
    #copyNotice {
      margin-top: 10px;
      color: green;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>60Month Restart PDF Forms</h1>
  <p>Select an option from the dropdown to display the associated PDF:</p>

  <!-- PDF Dropdown -->
  <select id="dropdown">
    <option value="">60month restart documents</option>
    <option value="6mwt">6MWT</option>
    <option value="ono">ONO</option>
    <option value="tss">TSS</option>
    <option value="discontinue">Discontinue Script</option>
    <option value="poc">POC Rx</option>
    <option value="60m">60month Letter</option>
  </select>
  <div id="copyNotice"></div>

  <!-- PDF Viewer Container -->
  <div class="pdf-container">
    <iframe id="pdfViewer" src=""></iframe>
  </div>
  
  <!-- Drawing Canvas Section -->
  <div class="draw-container">
    <h2>Annotate / Draw (Default Ink: Black)</h2>
    <canvas id="drawCanvas"></canvas><br>
    <button id="clearCanvas">Clear Drawing</button>
  </div>

  <script>
    /* -------------------- PDF Dropdown Logic -------------------- */
    const dropdown = document.getElementById("dropdown");
    const pdfViewer = document.getElementById("pdfViewer");
    
    // Map dropdown values to PDF URLs with "#view=FitH" parameter (fit-to-width)
    const pdfs = {
      "6mwt": "assets/6MWT.pdf#view=FitH",
      "ono": "assets/ONO.PDF#view=FitH",
      "tss": "assets/TSS.PDF#view=FitH",
      "60m": "assets/60monthletter.pdf#view=FitH",
      "discontinue": "assets/Discontinue Script.pdf#view=FitH",
      "poc": "assets/POC Rx.pdf#view=FitH"
    };
    
    // Returns the current date formatted as M/D/YYYY.
    function getFormattedDate() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      const year = today.getFullYear();
      return month + "/" + day + "/" + year;
    }
    
    // Update each dropdown option's date portion to the current date.
    function updateDropdownDates() {
      const currentDate = getFormattedDate();
      // Loop through <option> elements (skip the first placeholder)
      const options = dropdown.options;
      for (let i = 1; i < options.length; i++) {
        let option = options[i];
        // Option value is assumed to be "presetDate - Text", so split at " - "
        const dashIndex = option.value.indexOf(" - ");
        if (dashIndex !== -1) {
          const templateText = option.value.substring(dashIndex + 3);
          const newVal = `${currentDate} - ${templateText}`;
          option.value = newVal;
          option.text = newVal;
        }
      }
    }
    
    // Initialize the dropdown options on DOMContentLoaded.
    document.addEventListener("DOMContentLoaded", updateDropdownDates);
    
    // Handle dropdown change: load the PDF and copy the option text to clipboard.
    dropdown.addEventListener("change", function () {
      const selectedValue = dropdown.value;
      if (selectedValue && pdfs[dropdown.options[dropdown.selectedIndex].getAttribute("value")]) {
        // If a PDF is mapped, load it:
        pdfViewer.src = pdfs[dropdown.options[dropdown.selectedIndex].getAttribute("value") || dropdown.value];
        pdfViewer.style.display = "block";
      } else if (selectedValue) {
        pdfViewer.style.display = "none";
      }
      // For any selection, copy the selected value to clipboard.
      if (selectedValue) {
        navigator.clipboard.writeText(selectedValue).then(function () {
          displayCopyNotice("Copied: " + selectedValue);
        }).catch(function (err) {
          console.error("Failed to copy text: ", err);
        });
      }
    });
    
    // Display a temporary notice message.
    function displayCopyNotice(message) {
      const noticeEl = document.getElementById("copyNotice");
      noticeEl.innerText = message;
      setTimeout(function () {
        noticeEl.innerText = "";
      }, 3000);
    }
    
    /* -------------------- Drawing Canvas Logic -------------------- */
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    
    // Set initial drawing settings: default ink color black, line width 2.
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    
    // Resize canvas to match its displayed size.
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    // Call resize on load.
    resizeCanvas();
    
    let drawing = false;
    
    // Start drawing on mousedown.
    canvas.addEventListener("mousedown", function(e) {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    
    // Draw as mouse moves.
    canvas.addEventListener("mousemove", function(e) {
      if (!drawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });
    
    // Stop drawing on mouseup or when mouse leaves canvas.
    canvas.addEventListener("mouseup", function() { drawing = false; });
    canvas.addEventListener("mouseout", function() { drawing = false; });
    
    // Clear the canvas when the "Clear Drawing" button is clicked.
    document.getElementById("clearCanvas").addEventListener("click", function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
    
    // Optional: Adjust canvas size on window resize.
    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
</html>
