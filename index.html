<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Forms</title>
  <link rel="icon" type="image/jpg" href="PDF icon.jpg">
  <style>
    /* Global Settings */
    body {
      background-image: url('IMG_7391.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      background-position: right;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    h1, p {
      color: white;
      font-family: 'Calibri', sans-serif;
    }
    /* Dropdown Styling */
    select {
      padding: 10px;
      font-size: 16px;
      margin: 20px;
      color: #000; /* Draw ink color (text) is black by default */
    }
    /* PDF Viewer Styling */
    .pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    iframe {
      width: 80%;
      height: 800px;
      border: 1px solid #ccc;
      display: none; /* Hidden by default */
    }
    /* Copy Notification */
    #copyNotice {
      margin-top: 10px;
      color: green;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>60Month Restart PDF Forms</h1>
  <p>Select an option from the dropdown to display the associated PDF:</p>

  <!-- Dropdown Menu -->
  <select id="dropdown">
    <option value="">60month restart documents</option>
    <option value="6mwt">6MWT</option>
    <option value="ono">ONO</option>
    <option value="tss">TSS</option>
    <option value="discontinue">Discontinue Script</option>
    <option value="poc">POC Rx</option>
    <option value="60m">60month Letter</option>
  </select>
  <div id="copyNotice"></div>

  <!-- PDF Viewer Container -->
  <div class="pdf-container">
    <iframe id="pdfViewer" src=""></iframe>
  </div>

  <script>
    // PDF Dropdown Logic

    const dropdown = document.getElementById("dropdown");
    const pdfViewer = document.getElementById("pdfViewer");
    
    // Map dropdown values to PDF URLs with "#view=FitH" (fits to width)
    const pdfs = {
      "6mwt": "assets/6MWT.pdf#view=FitH",
      "ono": "assets/ONO.PDF#view=FitH",
      "tss": "assets/TSS.PDF#view=FitH",
      "60m": "assets/60monthletter.pdf#view=FitH",
      "discontinue": "assets/Discontinue Script.pdf#view=FitH",
      "poc": "assets/POC Rx.pdf#view=FitH"
    };

    // Returns current date formatted as M/D/YYYY.
    function getFormattedDate() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      const year = today.getFullYear();
      return month + "/" + day + "/" + year;
    }
    
    // Update each dropdown option to show the current date.
    function updateDropdownDates() {
      const currentDate = getFormattedDate();
      const options = dropdown.options;
      for (let i = 0; i < options.length; i++) {
        const option = options[i];
        if (option.value.trim() === "") continue; // Skip placeholder
        const dashIndex = option.value.indexOf(" - ");
        if (dashIndex !== -1) {
          const templateText = option.value.substring(dashIndex + 3);
          const newVal = `${currentDate} - ${templateText}`;
          option.value = newVal;
          option.text = newVal;
        }
      }
    }
    
    // Initialize dropdown options on DOMContentLoaded.
    document.addEventListener("DOMContentLoaded", updateDropdownDates);
    
    // When an option is selected, load the PDF (if mapped) and copy the option text.
    dropdown.addEventListener("change", function () {
      const selectedValue = dropdown.value;
      if (selectedValue && pdfs[dropdown.options[dropdown.selectedIndex].getAttribute("value")]) {
        // If a mapped PDF exists, load it.
        // Note: If your dropdown option values are updated with date,
        // you might consider using the original key or another mapping mechanism.
        const originalKey = dropdown.options[dropdown.selectedIndex].getAttribute("data-key") || dropdown.value;
        if (pdfs[originalKey]) {
          pdfViewer.src = pdfs[originalKey];
          pdfViewer.style.display = "block";
        } else {
          pdfViewer.style.display = "none";
        }
      } else if (selectedValue) {
        pdfViewer.style.display = "none";
      }
      
      // Copy the selected value to the clipboard.
      if (selectedValue) {
        navigator.clipboard.writeText(selectedValue).then(function () {
          displayCopyNotice("Copied: " + selectedValue);
        }).catch(function (err) {
          console.error("Failed to copy text: ", err);
        });
      }
    });
    
    // Function to display a temporary notification.
    function displayCopyNotice(message) {
      const noticeEl = document.getElementById("copyNotice");
      noticeEl.innerText = message;
      setTimeout(function () {
        noticeEl.innerText = "";
      }, 3000);
    }
  </script>
</body>
</html>
