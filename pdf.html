<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern PDF Form Viewer</title>

  <style>
    /* Google Fonts for a modern, clean look */
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    /* Global Settings */
    body {
      background-image: url('assets/IMG_7391.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      font-family: 'Roboto', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      color: #333; /* Default text color */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Main container for the content */
    #app-container {
      max-width: 1200px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.95); /* Semi-transparent white background */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); /* Soft shadow for depth */
    }
    
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    header p {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 30px;
    }

    /* Dropdown Styling */
    .dropdown-container {
      margin-bottom: 30px;
    }

    label {
      font-size: 1.1em;
      margin-right: 10px;
      font-weight: bold;
    }

    select {
      padding: 12px;
      font-size: 1em;
      border-radius: 8px;
      border: 1px solid #ccc;
      min-width: 350px;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    select:hover {
      border-color: #007bff;
    }

    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }
    
    /* PDF Viewer Styling */
    .pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 750px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden; /* Ensures iframe corners are rounded */
    }

    #viewer-message {
      font-size: 1.5em;
      color: #777;
    }

    iframe {
      width: 100%;
      height: 750px;
      border: none;
      display: none; /* Initially hidden */
    }
    
    /* Responsive Design for smaller screens */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      #app-container {
        padding: 20px;
      }
      header h1 {
        font-size: 2em;
      }
      label {
        display: block; /* Stack label on top of dropdown */
        margin-bottom: 10px;
      }
      select {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>60-Month Restart Forms</h1>
      <p>Select a document from the menu to display it below.</p>
    </header>

    <main>
      <div class="dropdown-container">
        <label for="pdf-select">Choose a document:</label>
        <select id="pdf-select">
          <option value="">-- Please choose an option --</option>
          <option value="60m">60-Month Letter</option>
          <option value="6mwt">6-Minute Walk Test (6MWT)</option>
          <option value="ono">Overnight Oximetry (ONO)</option>
          <option value="tss">Titration Sleep Study (TSS)</option>
          <option value="discontinue">Discontinue Script</option>
          <option value="poc">Portable Oxygen Concentrator (POC) Rx</option>
        </select>
      </div>

      <div class="pdf-container">
        <p id="viewer-message">Please select a form to continue.</p>
        <iframe id="pdf-viewer" title="PDF Document Viewer"></iframe>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {

      // Get references to the interactive HTML elements
      const dropdown = document.getElementById("pdf-select");
      const pdfViewer = document.getElementById("pdf-viewer");
      const viewerMessage = document.getElementById("viewer-message");

      // Map dropdown values to their corresponding PDF file paths
      const pdfs = {
        "6mwt": "assets/6MWT.pdf",
        "ono": "assets/ONO.pdf",
        "tss": "assets/TSS.pdf",
        "60m": "assets/60monthletter.pdf",
        "discontinue": "assets/Discontinue Script.pdf",
        "poc": "assets/POC Rx.pdf"
      };

      // Listen for changes on the dropdown menu
      dropdown.addEventListener("change", function () {
        const selectedKey = dropdown.value;

        // Check if the selected key is a valid one from our pdfs map
        if (selectedKey && pdfs[selectedKey]) {
          // Hide the initial message
          viewerMessage.style.display = "none";
          
          // Set the iframe source to the selected PDF
          // Appending #view=FitH tells most browsers to fit the PDF to the container width
          pdfViewer.src = `${pdfs[selectedKey]}#view=FitH`;

          // Display the iframe
          pdfViewer.style.display = "block";
        } else {
          // If the default option is selected, hide the iframe and show the message
          pdfViewer.style.display = "none";
          viewerMessage.style.display = "block";
        }
      });
    });
  </script>

</body>
</html>
