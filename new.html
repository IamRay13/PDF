<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Retrieval System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- PDF.js library from Mozilla -->
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #pdf-render {
            border: 1px solid #e2e8f0; /* dark:border-gray-600 */
            border-radius: 0.5rem;
        }
        .pdf-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 dark:text-white">Document Retrieval System</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Quickly find and manage your required documents.</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-8 max-w-2xl mx-auto">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" onkeyup="filterDocuments()" placeholder="Search for a document..." class="block w-full pl-10 pr-3 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>
        </div>

        <!-- Document Grid -->
        <div id="documentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Document items will be injected here -->
        </div>
    </div>

    <!-- Modal for document viewer -->
    <div id="documentModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-4xl max-h-[95vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b dark:border-gray-600 flex-shrink-0">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 dark:text-white">Document Title</h2>
                <button onclick="closeModal()" class="text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>
            <div id="modalContent" class="flex-grow overflow-y-auto p-4 text-center">
                 <!-- PDF canvas and controls will be injected here -->
                 <div id="loader" class="py-16">Loading document...</div>
                 <canvas id="pdf-render" class="hidden"></canvas>
            </div>
            <div id="modalActions" class="flex-shrink-0 p-4 border-t dark:border-gray-600 flex justify-between items-center">
                 <!-- Pagination and main action buttons -->
            </div>
        </div>
    </div>

    <script>
        // Set the workerSrc for PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://mozilla.github.io/pdf.js/build/pdf.worker.js`;

        // --- DATA ---
        const documents = [
            { name: "6MWT", icon: "fa-person-running", color: "bg-blue-500" },
            { name: "TSS", icon: "fa-file-medical", color: "bg-green-500" },
            { name: "ONO", icon: "fa-notes-medical", color: "bg-yellow-500" },
            { name: "ABG", icon: "fa-vial-circle-check", color: "bg-red-500" },
            { name: "POC Prescription", icon: "fa-file-prescription", color: "bg-indigo-500" },
            { name: "60month Restart Contract", icon: "fa-file-signature", color: "bg-purple-500" },
            { name: "CPAP Requalification", icon: "fa-lungs", color: "bg-orange-500" },
            { name: "Oxygen Requalification", icon: "fa-mask-ventilator", color: "bg-sky-500" },
            { name: "Discontinue Script", icon: "fa-file-circle-xmark", color: "bg-slate-500" },
        ];
        
        const pdfUrls = {
            "6MWT": "assets/6MWT.pdf",
            "TSS": "assets/TSS.pdf",
            "ONO": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "ABG": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "POC Prescription": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "60month Restart Contract": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "CPAP Requalification": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "Oxygen Requalification": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "Discontinue Script": "#"
        };

        // --- ELEMENTS ---
        const documentGrid = document.getElementById('documentGrid');
        const modal = document.getElementById('documentModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalActions = document.getElementById('modalActions');
        const pdfCanvas = document.getElementById('pdf-render');
        const loader = document.getElementById('loader');

        // --- PDF.js State ---
        let pdfDoc = null;
        let pageNum = 1;
        let pageIsRendering = false;
        let pageNumIsPending = null;
        const scale = 1.5;
        const ctx = pdfCanvas.getContext('2d');

        // --- FUNCTIONS ---
        function renderDocuments(docs) {
            documentGrid.innerHTML = '';
            docs.forEach(doc => {
                const card = `
                    <div class="document-card ${doc.color} text-white p-6 rounded-lg shadow-lg hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 ease-in-out cursor-pointer" 
                         onclick="openModal('${doc.name}')">
                        <div class="flex flex-col items-center text-center">
                            <i class="fas ${doc.icon} fa-3x mb-4"></i>
                            <h3 class="text-xl font-semibold">${doc.name}</h3>
                        </div>
                    </div>
                `;
                documentGrid.innerHTML += card;
            });
        }

        function filterDocuments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredDocs = documents.filter(doc => doc.name.toLowerCase().includes(searchTerm));
            renderDocuments(filteredDocs);
        }

        const renderPage = num => {
            pageIsRendering = true;
            // Get page
            pdfDoc.getPage(num).then(page => {
                // Set scale
                const viewport = page.getViewport({ scale });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport
                };
                page.render(renderContext).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });
                // Update UI
                document.getElementById('page-num').textContent = num;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        const onPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        };

        const onNextPage = () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        };

        function openModal(docName) {
            const pdfUrl = pdfUrls[docName];
            
            modalTitle.textContent = docName;
            modalActions.innerHTML = '';
            pdfCanvas.classList.add('hidden');
            loader.classList.remove('hidden');

            if (pdfUrl && pdfUrl !== '#') {
                // Show loading and fetch document
                pdfjsLib.getDocument(pdfUrl).promise.then(doc => {
                    pdfDoc = doc;
                    document.getElementById('page-count').textContent = pdfDoc.numPages;
                    renderPage(pageNum);

                    loader.classList.add('hidden');
                    pdfCanvas.classList.remove('hidden');
                }).catch(err => {
                    // CORS policy or other error
                    console.error("Error loading PDF:", err);
                    loader.textContent = "Error: Could not load PDF. Check browser console for details.";
                });

                // Setup modal actions
                modalActions.innerHTML = `
                    <div class="pdf-controls flex items-center gap-4">
                        <button id="prev-page" onclick="onPrevPage()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition"><i class="fas fa-arrow-left"></i></button>
                        <span>Page <span id="page-num"></span> of <span id="page-count"></span></span>
                        <button id="next-page" onclick="onNextPage()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition"><i class="fas fa-arrow-right"></i></button>
                    </div>
                    <button onclick="sendPdf('${docName}', '${pdfUrl}')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg transition-transform transform hover:scale-105 shadow-md flex items-center justify-center"><i class="fas fa-paper-plane mr-2"></i>Send Link</button>
                `;
            } else {
                loader.textContent = 'No file is linked for this document yet.';
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            // Reset state
            pdfDoc = null;
            pageNum = 1;
        }

        function sendPdf(docName, absoluteUrl) {
            const subject = encodeURIComponent(`Document: ${docName}`);
            const body = encodeURIComponent(`You can view the document at this link:\n${absoluteUrl}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        // --- INITIALIZATION ---
        renderDocuments(documents);
        
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
