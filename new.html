<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Retrieval System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the embedded PDF viewer */
        .pdf-viewer {
            width: 100%;
            height: 70vh; /* Make the viewer tall */
            border: 1px solid #e2e8f0; /* dark:border-gray-600 */
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 dark:text-white">Document Retrieval System</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Quickly find and manage your required documents.</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-8 max-w-2xl mx-auto">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" onkeyup="filterDocuments()" placeholder="Search for a document..." class="block w-full pl-10 pr-3 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>
        </div>

        <!-- Document Grid -->
        <div id="documentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Document items will be injected here by JavaScript -->
        </div>

    </div>

    <!-- Modal for document viewer and actions -->
    <div id="documentModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-4xl h-full max-h-[90vh] flex flex-col p-6">
            <div class="flex justify-between items-center mb-4 flex-shrink-0">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 dark:text-white">Document Title</h2>
                <button onclick="closeModal()" class="text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>
            <div id="modalContent" class="flex-grow overflow-y-auto mb-4">
                 <!-- PDF viewer will be injected here -->
            </div>
            <div id="modalActions" class="flex-shrink-0 text-center">
                 <!-- Action buttons will be injected here -->
            </div>
        </div>
    </div>


    <script>
        // --- DATA ---
        // List of all documents to display as cards
        const documents = [
            { name: "6MWT", icon: "fa-person-running", color: "bg-blue-500" },
            { name: "TSS", icon: "fa-file-medical", color: "bg-green-500" },
            { name: "ONO", icon: "fa-notes-medical", color: "bg-yellow-500" },
            { name: "ABG", icon: "fa-vial-circle-check", color: "bg-red-500" },
            { name: "POC Prescription", icon: "fa-file-prescription", color: "bg-indigo-500" },
            { name: "60month Restart Contract", icon: "fa-file-signature", color: "bg-purple-500" },
            { name: "CPAP Requalification", icon: "fa-lungs", color: "bg-orange-500" },
            { name: "Oxygen Requalification", icon: "fa-mask-ventilator", color: "bg-sky-500" },
            { name: "Discontinue Script", icon: "fa-file-circle-xmark", color: "bg-slate-500" },
        ];
        
        // Map document names to their corresponding PDF sample URLs.
        // Replace the URLs with the actual paths to your PDF files.
        const pdfUrls = {
            "6MWT": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "TSS": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "ONO": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "ABG": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "POC Prescription": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "60month Restart Contract": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "CPAP Requalification": "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
            "Oxygen Requalification": "https://www.adobe.com/support/products/enterprise/knowledgecenter/media/c4611_sample_explain.pdf",
            "Discontinue Script": "#" // Using '#' to signify no file is linked
        };


        // --- ELEMENTS ---
        const documentGrid = document.getElementById('documentGrid');
        const modal = document.getElementById('documentModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalActions = document.getElementById('modalActions');


        // --- FUNCTIONS ---
        /**
         * Renders the document cards to the grid.
         * @param {Array} docs - The array of document objects to render.
         */
        function renderDocuments(docs) {
            documentGrid.innerHTML = ''; // Clear existing documents
            docs.forEach(doc => {
                const card = `
                    <div class="document-card ${doc.color} text-white p-6 rounded-lg shadow-lg hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 ease-in-out cursor-pointer" 
                         onclick="openModal('${doc.name}')">
                        <div class="flex flex-col items-center text-center">
                            <i class="fas ${doc.icon} fa-3x mb-4"></i>
                            <h3 class="text-xl font-semibold">${doc.name}</h3>
                        </div>
                    </div>
                `;
                documentGrid.innerHTML += card;
            });
        }

        /**
         * Filters documents based on the search input and re-renders the grid.
         */
        function filterDocuments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredDocs = documents.filter(doc => doc.name.toLowerCase().includes(searchTerm));
            renderDocuments(filteredDocs);
        }

        /**
         * Opens the modal, embeds the PDF, and shows relevant actions.
         * @param {string} docName - The name of the document.
         */
        function openModal(docName) {
            const pdfUrl = pdfUrls[docName];
            
            modalTitle.textContent = docName;
            modalContent.innerHTML = ''; // Clear previous content
            modalActions.innerHTML = ''; // Clear previous actions

            if (pdfUrl && pdfUrl !== '#') {
                // If a valid PDF URL exists, embed it
                modalContent.innerHTML = `<iframe src="${pdfUrl}" class="pdf-viewer rounded-md"></iframe>`;
                
                // Add action buttons
                modalActions.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                         <button onclick="sendPdf('${docName}', '${pdfUrl}')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105 shadow-md flex items-center justify-center"><i class="fas fa-paper-plane mr-2"></i>Send Link</button>
                    </div>
                `;
            } else {
                // If no PDF is linked, show a message
                modalContent.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400 py-16">No file is linked for this document yet.</p>`;
            }
            
            modal.classList.remove('hidden');
        }

        /**
         * Closes the action modal.
         */
        function closeModal() {
            modal.classList.add('hidden');
            // Important to clear the iframe src to stop any background loading/activity
            modalContent.innerHTML = '';
        }

        /**
         * Opens the user's default email client with a pre-filled message.
         * @param {string} docName - The name of the document.
         * @param {string} absoluteUrl - The absolute URL of the PDF.
         */
        function sendPdf(docName, absoluteUrl) {
            const subject = encodeURIComponent(`Document: ${docName}`);
            const body = encodeURIComponent(`You can view the document at this link:\n${absoluteUrl}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }


        // --- INITIALIZATION ---
        // Initial render of all documents
        renderDocuments(documents);
        
        // Event listener to close the modal if clicked outside of its content
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
